name: Release Builder (Ubuntu 24.04)

on:
  push:
    branches: [ "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-u24:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Clone This Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run build derivation tests
        run: python3 test_build.py

      - name: Install Toolchain and Map GCC 10
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
          
          # Force legacy toolchain mappings to the system default compiler
          sudo ln -s /usr/bin/gcc /usr/bin/gcc-10
          sudo ln -s /usr/bin/g++ /usr/bin/g++-10

      - name: Initialize GitHub Release Target
        run: |
          gh release create v1.0.0-statics --title "Static Clang Binaries" --notes "Automated static builds" || true

      # --- CLANG 14 through 17 (ARM64 & AMD64) ---
      - name: Build and Upload Clang 14-17 Binaries
        run: |
          for ver in 14 15 16 17; do
            for plat in linux-arm64 linux-amd64; do
              python3 build.py --version $ver --platform $plat
              cmake --build build/ --config Release || true
              gh release upload v1.0.0-statics build/bin/* --clobber
            done
          done
