name: Clang-prebuilt-static-Builder (Ubuntu 22.04)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-u22:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone This Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install CMake Only
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake

      # --- CLANG 12 ARM64 LINEAR BUILDOUT ---
      - name: Python Build Clang 12 ARM64
        run: python3 build.py --version 12 --platfrom linux-arm64

      - name: CMake Link Clang 12 ARM64
        run: cmake --build build/ --config Release || true

      - name: Save Clang 12 ARM64 Artifact
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "Save Clang 12 ARM64 [skip ci]" && git push

      # --- CLANG 12 AMD64 LINEAR BUILDOUT ---
      - name: Python Build Clang 12 AMD64
        run: python3 build.py --version 12 --platfrom linux-amd64

      - name: CMake Link Clang 12 AMD64
        run: cmake --build build/ --config Release || true

      - name: Save Clang 12 AMD64 Artifact
        run: |
          git pull --rebase
          git add .
          git diff-index --quiet HEAD || git commit -m "Save Clang 12 AMD64 [skip ci]" && git push

      # --- CLANG 13 ARM64 LINEAR BUILDOUT ---
      - name: Python Build Clang 13 ARM64
        run: python3 build.py --version 13 --platfrom linux-arm64

      - name: CMake Link Clang 13 ARM64
        run: cmake --build build/ --config Release || true

      - name: Save Clang 13 ARM64 Artifact
        run: |
          git pull --rebase
          git add .
          git diff-index --quiet HEAD || git commit -m "Save Clang 13 ARM64 [skip ci]" && git push

      # --- CLANG 13 AMD64 LINEAR BUILDOUT ---
      - name: Python Build Clang 13 AMD64
        run: python3 build.py --version 13 --platfrom linux-amd64

      - name: CMake Link Clang 13 AMD64
        run: cmake --build build/ --config Release || true

      - name: Save Clang 13 AMD64 Artifact
        run: |
          git pull --rebase
          git add .
          git diff-index --quiet HEAD || git commit -m "Save Clang 13 AMD64 [skip ci]" && git push
          
