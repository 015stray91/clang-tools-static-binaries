name: Pre-Build Ladder (LLVM 12-17)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build-ladder:
    name: Build LLVM ${{ matrix.version }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        version: [12, 13, 14, 15, 16, 17]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build deps
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential cmake ninja-build git \
            libzstd-dev libz-dev liblz4-dev \
            libcurl4-openssl-dev libssl-dev zlib1g-dev

      - name: Build LLVM ${{ matrix.version }}
        run: |
          python3 build.py --version ${{ matrix.version }} \
                           --platform linux-amd64 \
                           --build-dir /tmp/llvm-build

      - name: Stage binaries to repo
        run: |
          mkdir -p llvm-binaries/llvm-${{ matrix.version }}
          cp -r /tmp/llvm-build/* llvm-binaries/llvm-${{ matrix.version }}/ 2>/dev/null || true
          find llvm-binaries/llvm-${{ matrix.version }}/bin/ -type f | head -20

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add llvm-binaries/llvm-${{ matrix.version }}/
          git commit -m "ci: add LLVM ${{ matrix.version }} binaries"
          git push

