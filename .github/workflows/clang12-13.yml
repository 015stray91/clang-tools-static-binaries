name: Release Builder (Ubuntu 22.04)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-u22:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Clone This Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install CMake Only
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake

      - name: Initialize GitHub Release Target
        run: |
          gh release create v1.0.0-statics --title "Static Clang Binaries" --notes "Automated static builds" || true

      # --- CLANG 12 & 13 (ARM64 & AMD64) ---
      - name: Build and Upload Clang 12 and 13 Binaries
        run: |
          for ver in 12 13; do
            for plat in linux-arm64 linux-amd64; do
              python3 build.py --version $ver --platform $plat
              cmake --build build/ --config Release || true
              gh release upload v1.0.0-statics build/bin/* --clobber
            done
          done
          
